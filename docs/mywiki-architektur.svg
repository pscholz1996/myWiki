<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="554" viewBox="0 0 1020 554" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <!-- Pfeilspitzen bewusst als Dreieck-Pfade, nicht als <marker>: Marker
       werden von vielen SVG-Renderern (Office, diverse Konverter) ignoriert,
       dann bleiben nur nackte Striche ohne Richtung übrig. -->

  <rect width="1020" height="554" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#1f2328">myWiki — Aufbau und Funktionsweise</text>

  <!-- ========== ZONEN ========== -->
  <rect x="32" y="74" width="578" height="460" rx="14" fill="#f6f7f9" stroke="#c8cdd4" stroke-width="1.5"/>
  <rect x="740" y="74" width="248" height="460" rx="14" fill="#fdf6f1" stroke="#e5c3ac" stroke-width="1.5" stroke-dasharray="7 4"/>

  <rect x="48" y="88" width="170" height="24" rx="12" fill="#e4e8ed"/>
  <text x="61" y="105" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#3f4650">LOKAL — dein Rechner</text>

  <rect x="756" y="88" width="70" height="24" rx="12" fill="#f6e0d3"/>
  <text x="769" y="105" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#a4482a">CLOUD</text>

  <!-- ========== LOKAL ========== -->
  <rect x="56" y="118" width="530" height="50" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="72" y="148" font-size="15" font-weight="700" fill="#1f2328">Browser — Chat-Oberfläche</text>

  <rect x="56" y="214" width="530" height="64" rx="9" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.8"/>
  <text x="72" y="240" font-size="15" font-weight="700" fill="#1f2328">myWiki-Server</text>
  <text x="72" y="261" font-size="11.5" fill="#5b636d">Next.js · Claude Agent SDK</text>

  <rect x="56" y="326" width="254" height="62" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="72" y="352" font-size="14" font-weight="700" fill="#1f2328">Index — SQLite</text>
  <text x="72" y="373" font-size="11.5" fill="#5b636d">FTS5 + sqlite-vec, hybride Suche</text>

  <rect x="332" y="326" width="254" height="62" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="348" y="352" font-size="14" font-weight="700" fill="#1f2328">Wissensordner</text>
  <text x="348" y="373" font-size="11.5" fill="#5b636d">PDFs, Bilder, Verlauf</text>

  <rect x="56" y="436" width="530" height="62" rx="9" fill="#ffffff" stroke="#9aa3ad"/>
  <text x="72" y="462" font-size="14" font-weight="700" fill="#1f2328">Ingestion</text>
  <text x="72" y="483" font-size="11.5" fill="#5b636d">PDF / PPTX → Chunks → Embeddings · Modell läuft lokal auf der CPU</text>

  <!-- ========== CLOUD ========== -->
  <rect x="764" y="214" width="200" height="64" rx="9" fill="#ffffff" stroke="#d97757" stroke-width="1.8"/>
  <text x="780" y="240" font-size="15" font-weight="700" fill="#a4482a">Claude</text>
  <text x="780" y="261" font-size="11.5" fill="#5b636d">Anthropic · dein Claude-Konto</text>

  <rect x="764" y="326" width="200" height="50" rx="9" fill="#ffffff" stroke="#d9b49c"/>
  <text x="780" y="352" font-size="14" font-weight="700" fill="#1f2328">CrossRef</text>
  <text x="780" y="369" font-size="11" fill="#5b636d">Metadaten zu DOIs</text>

  <!-- Bewusst blass und gestrichelt: einmaliger Download, kein laufender
       Dienst - sonst liest man das Embedding als Cloud-Vorgang. -->
  <rect x="764" y="436" width="200" height="56" rx="9" fill="#fdfaf7" stroke="#e3d2c5" stroke-dasharray="5 3"/>
  <text x="780" y="462" font-size="13" font-weight="700" fill="#9aa3ad">Hugging Face</text>
  <text x="780" y="480" font-size="11" fill="#9aa3ad">nur einmaliger Download</text>

  <!-- ========== PFEILE ========== -->

  <!-- 1  Browser -> Server -->
  <line x1="110" y1="168" x2="110" y2="208" stroke="#5b636d" stroke-width="1.6"/>
  <path d="M 105.5 204 L 114.5 204 L 110 213 z" fill="#5b636d"/>
  <circle cx="134" cy="188" r="8.5" fill="#d97757"/>
  <text x="134" y="192" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="149" y="192" font-size="10.5" fill="#3f4650">Frage</text>

  <!-- 5  Server -> Browser -->
  <line x1="420" y1="208" x2="420" y2="172" stroke="#5b636d" stroke-width="1.6"/>
  <path d="M 415.5 176 L 424.5 176 L 420 167 z" fill="#5b636d"/>
  <circle cx="444" cy="188" r="8.5" fill="#d97757"/>
  <text x="444" y="192" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="459" y="192" font-size="10.5" fill="#3f4650">Antwort + Quellen</text>

  <!-- 2  Server -> Claude -->
  <line x1="586" y1="238" x2="756" y2="238" stroke="#d97757" stroke-width="1.6"/>
  <path d="M 752 233.5 L 752 242.5 L 761 238 z" fill="#d97757"/>
  <circle cx="622" cy="221" r="8.5" fill="#d97757"/>
  <text x="622" y="225" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="636" y="225" font-size="10.5" font-weight="600" fill="#a4482a">Frage + Werkzeuge</text>

  <!-- 3  Claude -> Server -->
  <line x1="760" y1="262" x2="594" y2="262" stroke="#d97757" stroke-width="1.6"/>
  <path d="M 598 257.5 L 598 266.5 L 589 262 z" fill="#d97757"/>
  <circle cx="622" cy="283" r="8.5" fill="#d97757"/>
  <text x="622" y="287" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="636" y="287" font-size="10.5" font-weight="600" fill="#a4482a">Werkzeugaufruf</text>

  <!-- 4  Server <-> Index -->
  <line x1="106" y1="278" x2="106" y2="318" stroke="#5b636d" stroke-width="1.6"/>
  <path d="M 101.5 314 L 110.5 314 L 106 323 z" fill="#5b636d"/>
  <line x1="132" y1="322" x2="132" y2="284" stroke="#5b636d" stroke-width="1.6"/>
  <path d="M 127.5 288 L 136.5 288 L 132 279 z" fill="#5b636d"/>
  <circle cx="156" cy="301" r="8.5" fill="#d97757"/>
  <text x="156" y="305" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="170" y="305" font-size="10.5" fill="#3f4650">Suche → Textstellen</text>

  <!-- Server <-> Wissensordner -->
  <line x1="420" y1="278" x2="420" y2="318" stroke="#5b636d" stroke-width="1.4"/>
  <path d="M 415.5 314 L 424.5 314 L 420 323 z" fill="#5b636d"/>
  <line x1="442" y1="322" x2="442" y2="284" stroke="#5b636d" stroke-width="1.4"/>
  <path d="M 437.5 288 L 446.5 288 L 442 279 z" fill="#5b636d"/>
  <text x="458" y="305" font-size="10.5" fill="#3f4650">Seiten &amp; Bilder</text>

  <!-- Ingestion -> Index -->
  <line x1="106" y1="436" x2="106" y2="404" stroke="#5b636d" stroke-width="1.4"/>
  <path d="M 101.5 408 L 110.5 408 L 106 399 z" fill="#5b636d"/>
  <text x="120" y="422" font-size="10.5" fill="#3f4650">Chunks + Vektoren</text>

  <!-- Ingestion -> Wissensordner -->
  <line x1="420" y1="436" x2="420" y2="404" stroke="#5b636d" stroke-width="1.4"/>
  <path d="M 415.5 408 L 424.5 408 L 420 399 z" fill="#5b636d"/>
  <text x="434" y="422" font-size="10.5" fill="#3f4650">Original-Datei</text>

  <!-- Ingestion -> CrossRef. Als Winkel geführt, weil CrossRef eine Zeile
       hoeher sitzt: ein gerader Pfeil auf dieser Hoehe wuerde in der
       Hugging-Face-Box landen. -->
  <polyline points="586,452 690,452 690,351 756,351" fill="none" stroke="#c08a67" stroke-width="1.4"/>
  <path d="M 752 346.5 L 752 355.5 L 761 351 z" fill="#c08a67"/>
  <text x="620" y="444" font-size="10.5" fill="#a4482a">DOI-Abfrage</text>

  <!-- Hugging Face -> Ingestion (einmalig, daher gestrichelt und blass) -->
  <line x1="760" y1="470" x2="594" y2="470" stroke="#b9c0c8" stroke-width="1.4" stroke-dasharray="5 3"/>
  <path d="M 598 465.5 L 598 474.5 L 589 470 z" fill="#b9c0c8"/>
</svg>
